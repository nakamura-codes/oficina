<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Shonen Deck</title>
    <style>
      /* GameFont: Pixelify Sans para o texto e Jersey 10 só para os dígitos (a regra mais específica vem depois). */
      @font-face { font-family: 'GameFont'; src: url('fonts/pixelify.woff2') format('woff2'); font-weight: 400 700; font-display: block; }
      @font-face { font-family: 'GameFont'; src: url('fonts/jersey10.woff2') format('woff2'); unicode-range: U+0030-0039; size-adjust: 118%; font-weight: 400 700; font-display: block; }
      /* GameNum: Jersey 10 inteira, para números sozinhos (custo, HP, Ki, tempo). */
      @font-face { font-family: 'GameNum'; src: url('fonts/jersey10.woff2') format('woff2'); font-display: block; }
      html, body { margin: 0; height: 100%; background: #120f1c; overflow: hidden; }
      #game { width: 100vw; height: 100vh; height: 100dvh; }
      #game canvas { image-rendering: pixelated; }
      .card-reading {
        position: fixed; z-index: 30; left: 50%; transform: translateX(-50%);
        width: max-content; max-width: min(36rem, calc(100vw - 24px)); box-sizing: border-box;
        padding: 10px 16px; background: #211d30; color: #fff6e6; border: 2px solid #efbb62;
        box-shadow: 0 3px 0 #100c18; border-radius: 5px; pointer-events: none;
        font: 17px/1.45 Arial, sans-serif; overflow-wrap: anywhere;
      }
      .card-reading strong { display: block; color: #ffda88; }
      .hand-reading { font-size: clamp(18px, 1.6vw, 22px); }
      .card-inspector { width: min(330px, 86vw); box-sizing: border-box; max-height: 88dvh; overflow: auto;
        background: #211d30; color: #fff6e6; border: 2px solid #efbb62; border-radius: 8px; padding: 20px;
        font: 18px/1.5 Arial,sans-serif; }
      .card-inspector::backdrop { background: #100c18bc; }
      .card-inspector img { float: left; width: 60px; height: 60px; object-fit: contain; margin-right: 12px; image-rendering: pixelated; }
      .card-inspector span { color: #ffda88; font-weight: bold; }
      .card-inspector h2 { font-size: 22px; margin: 0; line-height: 1.15; }
      .card-inspector p { clear: both; padding-top: 14px; }
      .card-inspector button { background: #ffda88; color: #241a20; border: 0; padding: 10px 16px; min-height: 44px; font: inherit; border-radius: 4px; }
      input.name-input {
        font-family: 'GameFont', monospace; font-size: 18px; width: 220px; padding: 6px 10px;
        background: #1f1a2e; color: #f4ecd8; border: 3px solid #f0a830; border-radius: 4px; outline: none;
      }
      input.name-input:focus { border-color: #ffe28a; }
      /* Nome na plaquinha do inventário: sem caixa, o fundo é a própria plaquinha. */
      input.plate-input {
        font-family: 'GameFont', monospace; font-size: 17px; font-weight: bold; text-align: center;
        background: transparent; color: #ffffff; border: none; outline: none; padding: 0;
        text-shadow: 0 2px 0 #0d0a14, 0 -1px 0 #0d0a14, 2px 0 0 #0d0a14, -2px 0 0 #0d0a14;
      }
      input.plate-input:focus { color: #ffe28a; }
      /* Campos do login: o fundo é a própria caixa do painel. */
      input.field-input {
        font-family: 'GameFont', monospace; font-size: 20px; text-align: center; box-sizing: border-box;
        background: transparent; color: #ffffff; border: none; outline: none; padding: 0 8px;
      }
      input.field-input::placeholder { color: #7f8bb0; }
      input.field-input:focus { color: #ffe28a; }
    </style>
  </head>
  <body>
    <div id="game"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
